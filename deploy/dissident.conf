[server]
panel_listen = 0.0.0.0:8090
proxy_listen = 0.0.0.0:10909

[paths]
urls_file  = /var/lib/dissident/urls.txt
state_file = /var/lib/dissident/state.json
log_dir    = /var/log/dissident
xray_bin   = /usr/local/bin/xray

[cycle]
interval             = 1800s
fetch_timeout        = 20s
active_liveness      = 15s
active_idle          = 60s
ready_liveness       = 100s
probe_count          = 3
probe_window         = 8s
probe_budget_per_min = 60
ready_min            = 5
ready_target         = 5
failed_retry         = 30m

[swap]
drain_timeout     = 30s
promotion_timeout = 15s

[test]
cheap_workers     = 16
real_workers      = 4
real_test_cap     = 0
tcp_timeout       = 3s
tls_timeout       = 3s
protocol_timeout  = 3s
xray_timeout      = 10s
http_timeout      = 5s
speed_size        = 1000000
min_speed_mbps    = 1
max_ttfb_ms       = 2500
stability_passes  = 3
content_quorum    = 3
content_min_bytes = 4096
# Direct egress on this host. Leave empty so qualification and xray dial out
# directly; there is no HTTP egress proxy in production.
# egress_proxy     =

[urls]
probe          = https://www.gstatic.com/generate_204,https://www.cloudflare.com/cdn-cgi/trace
verify         = https://www.google.com/generate_204,https://www.gstatic.com/generate_204
content        = https://youtube.com,https://www.cloudflare.com,https://telegram.org/,https://www.instagram.com/
speed          = https://speed.cloudflare.com/__down?bytes=1000000
speed_fallback = https://proof.ovh.net/files/10Mb.dat
upload         = https://www.google.com/
http2          = https://www.youtube.com/
exit_ip        = https://api.ipify.org/

[log]
level          = info
access         = true
retention_days = 30
max_size_mb    = 100
