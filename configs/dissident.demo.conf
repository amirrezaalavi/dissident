# Dissident demo configuration template.
#
# Start with:
#   go run ./cmd/dissident -config ./configs/dissident.demo.conf
#
# This file is a template: it contains no subscription links and no real
# egress proxy address. Put links or subscription URLs in ./configs/urls.txt.

[server]
panel_listen = 0.0.0.0:8090
proxy_listen = 0.0.0.0:10909

[paths]
urls_file  = ./configs/urls.txt
state_file = ./var/state.json
log_dir    = ./var/log
xray_bin   = /usr/local/bin/xray

[cycle]
interval             = 300s
active_liveness      = 15s
active_idle          = 60s
ready_liveness       = 100s
probe_count          = 3
probe_window         = 8s
probe_budget_per_min = 60
ready_min            = 1
ready_target         = 3

[swap]
drain_timeout     = 30s
promotion_timeout = 15s

[test]
cheap_workers     = 8
real_workers      = 1
real_test_cap     = 0
tcp_timeout       = 3s
tls_timeout       = 3s
protocol_timeout  = 3s
xray_timeout      = 10s
http_timeout      = 10s
speed_size        = 4000000
min_speed_mbps    = 2.5
max_ttfb_ms       = 2500
stability_passes  = 1
content_quorum    = 3
content_min_bytes = 4096
# Demo/network escape hatch only. Leave empty in production so xray dials directly.
# egress_proxy      = http://127.0.0.1:10808

[urls]
probe          = https://www.gstatic.com/generate_204,https://www.cloudflare.com/cdn-cgi/trace
verify         = https://www.google.com/generate_204,https://1.1.1.1/cdn-cgi/trace
content        = https://youtube.com,https://www.cloudflare.com,https://telegram.org/,https://www.instagram.com/
speed          = https://proof.ovh.net/files/10Mb.dat
speed_fallback = https://speed.cloudflare.com/__down?bytes=
exit_ip        = https://api.ipify.org/

[log]
level          = info
access         = true
retention_days = 30
max_size_mb    = 100
